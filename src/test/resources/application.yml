spring:
  application:
    name: evops-base-test
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:museum-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.evops: INFO
